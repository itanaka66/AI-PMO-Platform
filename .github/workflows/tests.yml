name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # 台帳の PostgreSQL 版のテスト用。無ければ該当テストは飛ばされる。
    # For the PostgreSQL ledger tests; without it those tests are skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: aipmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIPMO_TEST_PG_DSN: postgresql://postgres:testpw@localhost:5432/aipmo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check aipmo/ tests/
      - run: mypy aipmo/
      - run: pytest -q
