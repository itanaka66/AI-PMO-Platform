# AI-PMO Platform — Docker 構成 / Docker deployment
#
#   docker compose up -d
#   docker compose run --rm aipmo setup
#
# ローカル LLM を使う構成。会議 Transcript を外部に出さない。
# Runs everything locally, so meeting transcripts never leave the network.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aipmo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aipmo}
      POSTGRES_DB: aipmo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipmo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # GPU がある場合はコメントを外す / uncomment if a GPU is available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  aipmo:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      AIPMO_CONFIG: /app/config.docker.yaml
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./prompts:/app/prompts:ro
      - ./templates:/app/templates:ro
      - ./queries.yaml:/app/queries.yaml:ro
    # 常駐スケジューラは Step 5。現状は都度実行。
    # The resident scheduler is Step 5; for now this runs on demand.
    entrypoint: ["aipmo"]
    command: ["schedule"]
    stop_grace_period: 120s

volumes:
  postgres_data:
  qdrant_data:
  ollama_models:
