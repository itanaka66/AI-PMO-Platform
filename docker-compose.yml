# AI-PMO Platform — Docker 構成 / Docker deployment
#
#   ./scripts/install-docker.sh
#     PostgreSQL・Ollama・Qdrant をそれぞれ自前で立てるか外部に接続するか
#     対話的に選べる。選ばなかったものはコンテナも volume も作られない。
#     Interactively choose, for each of PostgreSQL/Ollama/Qdrant, whether
#     to run it here or connect to an external one. Whichever you skip
#     gets neither a container nor a volume.
#
# スクリプトを使わず直接動かす場合、自前で立てたいものだけ profile で
# 指定する。指定しなかったものは .env の値（既定は空、または compose 内の
# コンテナ名）に向く:
#
#   docker compose --profile postgres --profile ollama --profile qdrant up -d
#     # 全部自前 / everything self-hosted
#   docker compose --profile postgres up -d
#     # PostgreSQL だけ自前、Ollama・Qdrant は .env の外部接続先へ
#     # / only PostgreSQL self-hosted; Ollama and Qdrant go wherever .env points
#
# Running this directly instead of the script: request a profile for each
# of PostgreSQL/Ollama/Qdrant you want to self-host. Skipping a profile
# means that service's connection comes from .env instead (external URL,
# or left unset if you are not using it — see .env.example).
#
#   docker compose run --rm aipmo setup

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: aipmo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aipmo}
      POSTGRES_DB: aipmo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipmo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # GPU がある場合はコメントを外す / uncomment if a GPU is available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  aipmo:
    build: .
    # postgres・ollama・qdrant はどれも外部かもしれず、depends_on では
    # 条件付きにできないため持たない。接続の待ち合わせはアプリ側の
    # リトライ（postgres アダプタの connect_attempts など）に任せる。
    #
    # No depends_on: postgres/ollama/qdrant may each be external, and
    # Compose cannot make a dependency conditional. Waiting for them to be
    # ready is left to the application's own retry logic (e.g. the
    # postgres adapter's connect_attempts).
    environment:
      AIPMO_CONFIG: /app/config.docker.yaml
      AIPMO_PG_DSN: ${AIPMO_PG_DSN:-postgresql://aipmo:aipmo@postgres:5432/aipmo}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - ./prompts:/app/prompts:ro
      - ./templates:/app/templates:ro
      - ./queries.yaml:/app/queries.yaml:ro
    # 常駐スケジューラは Step 5。現状は都度実行。
    # The resident scheduler is Step 5; for now this runs on demand.
    entrypoint: ["aipmo"]
    command: ["schedule"]
    stop_grace_period: 120s

volumes:
  postgres_data:
  qdrant_data:
  ollama_models:
