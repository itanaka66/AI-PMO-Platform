[project]
name = "aipmo"
version = "0.1.0"
description = "テンプレート駆動の PMO 業務自動化基盤"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
cloud = ["openai>=1.30"]
data = ["psycopg[binary]>=3.1", "qdrant-client>=1.9"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "qdrant-client>=1.9", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
aipmo = "aipmo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 明示的に指定する。指定しないと setuptools が templates/ や install/ を
# パッケージと誤認してビルドが失敗する。
# Explicit: without this, setuptools mistakes templates/ and install/ for
# packages and refuses to build.
[tool.setuptools]
packages = ["aipmo", "aipmo.dsl", "aipmo.engine", "aipmo.adapters", "aipmo.llm", "aipmo.web"]

[tool.setuptools.package-data]
"aipmo.web" = ["static/*"]
