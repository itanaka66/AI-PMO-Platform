[project]
name = "aipmo"
version = "0.1.0"
description = "テンプレート駆動の PMO 業務自動化基盤"
requires-python = ">=3.10"
# SPDX 文字列形式 (PEP 639) は setuptools 77 以降。
# 古い環境でも入るよう、ファイル指定の書き方にしている。
# The SPDX string form needs setuptools 77+; the file form installs anywhere.
license = { file = "LICENSE" }
authors = [{ name = "agNedia Inc." }]
keywords = ["pmo", "project-management", "llm", "automation", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
cloud = ["openai>=1.30"]
data = ["psycopg[binary]>=3.1", "qdrant-client>=1.9"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# ベクトルストアはどれか1つを選ぶ想定。qdrant は data に含まれる。
# Pick exactly one vector store; qdrant already ships with data.
vector-pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
vector-chroma = ["chromadb>=0.5"]
vector-milvus = ["pymilvus>=2.4"]
vector-weaviate = ["weaviate-client>=4.6"]
dev = ["pytest>=8.0", "psycopg[binary]>=3.1", "qdrant-client>=1.9", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
aipmo = "aipmo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 明示的に指定する。指定しないと setuptools が templates/ や install/ を
# パッケージと誤認してビルドが失敗する。
# Explicit: without this, setuptools mistakes templates/ and install/ for
# packages and refuses to build.
[tool.setuptools]
packages = ["aipmo", "aipmo.dsl", "aipmo.engine", "aipmo.adapters", "aipmo.llm", "aipmo.web"]

[tool.setuptools.package-data]
"aipmo.web" = ["static/*"]
