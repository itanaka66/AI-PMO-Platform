name: parallel_analysis
version: "1"
industry: software
description: |
  会議 Transcript を複数の LLM で同時に分析（議事録・TODO・決定事項）
  この例は、depends_on を使った並列実行の典型的なパターンを示す。

trigger:
  type: manual

params:
  jira_project: PROJ
  slack_channel: "#pmo"

steps:
  # ========================================
  # Phase 1: 前提条件（Transcript 取得）
  # ========================================
  
  - id: fetch_transcript
    kind: adapter
    adapter: teams
    action: get_transcript
    group: fetch
    depends_on: []
    inputs:
      meeting_id: "{{ trigger.meeting_id }}"
    retry:
      max_attempts: 3
      backoff_seconds: 2


  # ========================================
  # Phase 2: 並列分析（3つの LLM を同時実行）
  # ========================================
  # fetch_transcript の完了後、これら3つは依存関係がないので
  # ThreadPoolExecutor で同時に実行される
  
  - id: generate_minutes
    kind: llm
    group: analysis
    depends_on: [fetch_transcript]
    llm:
      profile: default
      temperature: 0.1
    prompt: minutes_ja
    inputs:
      transcript: "{{ steps.fetch_transcript.output.text }}"
    output_format: json
    output_schema:
      required: [title, decisions, action_items]
    when: "{{ steps.fetch_transcript.output.text != '' }}"
    continue_on_error: false

  - id: extract_todos
    kind: llm
    group: analysis
    depends_on: [fetch_transcript]
    llm:
      profile: default
      temperature: 0.1
    prompt: extract_todos_ja
    inputs:
      transcript: "{{ steps.fetch_transcript.output.text }}"
    output_format: json
    output_schema:
      required: [items]
    continue_on_error: false

  - id: extract_decisions
    kind: llm
    group: analysis
    depends_on: [fetch_transcript]
    llm:
      profile: default
      temperature: 0.1
    prompt: extract_decisions_ja
    inputs:
      transcript: "{{ steps.fetch_transcript.output.text }}"
    output_format: json
    output_schema:
      required: [items]
    continue_on_error: false


  # ========================================
  # Phase 3: アダプタ呼び出し
  # ========================================
  # 前フェーズの LLM が完了後、Jira 起票と通知を実行
  
  - id: register_jira
    kind: adapter
    adapter: jira
    action: create_issues
    group: register
    depends_on: [extract_todos]
    inputs:
      project: "{{ params.jira_project }}"
      issues: "{{ steps.extract_todos.output.items }}"
    when: "{{ steps.extract_todos.output.items | length > 0 }}"
    continue_on_error: true


  # ========================================
  # Phase 4: 通知（複数チャンネルに同時投稿）
  # ========================================
  # extract_* の完了後、複数の Slack 通知が並列実行される
  
  - id: notify_pmo
    kind: adapter
    adapter: slack
    action: post_message
    group: notify
    depends_on: [generate_minutes]
    inputs:
      channel: "{{ params.slack_channel }}"
      text: |
        📋 *議事録*
        {{ steps.generate_minutes.output.title }}
        
        *決定事項:*
        {{ steps.generate_minutes.output.decisions }}
        
        *Action Items:*
        {{ steps.generate_minutes.output.action_items }}
    continue_on_error: true

  - id: notify_decisions
    kind: adapter
    adapter: slack
    action: post_message
    group: notify
    depends_on: [extract_decisions]
    inputs:
      channel: "#decisions"
      text: |
        🎯 *会議の決定事項*
        {{ steps.extract_decisions.output.items | join(", ") }}
    continue_on_error: true

  - id: notify_todos
    kind: adapter
    adapter: slack
    action: post_message
    group: notify
    depends_on: [register_jira]
    inputs:
      channel: "#todos"
      text: |
        ✅ *Jira に登録されました*
        {{ steps.register_jira.output.created_count }} 件の課題を作成しました
    when: "{{ steps.register_jira.output.created_count > 0 }}"
    continue_on_error: true
