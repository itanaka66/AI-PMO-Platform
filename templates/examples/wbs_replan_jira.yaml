name: wbs_replan_jira
version: "1"
industry: software
description: |
  wbs_replan.yaml と同じ判定・提案ロジックだが、タスク一覧を params で
  手渡しする代わりに、実際の Jira スプリントから取得する。

  agile.sprint_issues が返す points フィールドを、risk_forecast.forecast
  が期待する effort という名前に変換する to_forecast_tasks を挟むだけで
  接続できる。フィールド名の付け替え自体は言語モデルにも DSL の式にも
  させず、組み込み変換（BUILTIN_TRANSFORMS）で機械的に行う。

  境界・tier の扱いは wbs_replan.yaml と同一。

trigger: "schedule:0 7 * * MON-FRI"

params:
  wbs_id: "wbs-main"
  sprint_id: 0
  board_id: null
  deadline: "2026-03-31"
  velocity_per_day: 2.0
  slack_channel: "#pmo"

steps:
  - id: issues
    adapter: agile
    action: sprint_issues
    inputs:
      sprint_id: "{{ params.sprint_id }}"
      board_id: "{{ params.board_id }}"

  # points -> effort の付け替え。これが無いと risk_forecast は全タスクを
  # 「見積もり無し」として扱ってしまう（キー名が一致しないため）。
  - id: tasks
    expression: to_forecast_tasks
    inputs:
      items: "{{ steps.issues.output.items }}"

  - id: previous
    adapter: postgres
    action: query
    inputs:
      name: latest_forecast_snapshot
      params:
        wbs_id: "{{ params.wbs_id }}"

  - id: forecast
    adapter: risk_forecast
    action: forecast
    inputs:
      tasks: "{{ steps.tasks.output }}"
      velocity_per_day: "{{ params.velocity_per_day }}"
      deadline: "{{ params.deadline }}"
      as_of: "{{ run.date }}"

  - id: pending
    adapter: wbs_replan
    action: pending_count
    inputs:
      wbs_id: "{{ params.wbs_id }}"

  - id: classify
    adapter: risk_forecast
    action: classify_drift
    inputs:
      drift_days: "{{ steps.forecast.output.drift_days }}"
      previous_drift_days: "{{ steps.previous.output.rows[0].drift_days }}"
      pending_count: "{{ steps.pending.output.count }}"

  - id: snapshot
    adapter: postgres
    action: execute
    inputs:
      name: save_forecast_snapshot
      params:
        wbs_id: "{{ params.wbs_id }}"
        drift_days: "{{ steps.forecast.output.drift_days }}"
        tier: "{{ steps.classify.output.tier }}"
        forecast: "{{ steps.forecast.output }}"

  - id: replan
    when: "{{ steps.classify.output.should_propose }} == true"
    agent:
      tools:
        - wbs_replan.propose
      allow_writes: true
      max_iterations: 3
    llm:
      profile: default
      temperature: 0.2
    prompt_inline: |
      あなたは PMO 担当です。WBS "{{ params.wbs_id }}"（Jiraスプリント
      {{ params.sprint_id }}）の進捗予測から、締切までに間に合わせるための
      再計画案を考えてください。

      現在の状況:
      - 締切: {{ params.deadline }}
      - 本日: {{ run.date }}
      - 完了: {{ steps.forecast.output.done_tasks }} / {{ steps.forecast.output.total_tasks }}
        （{{ steps.forecast.output.percent_done }}%）
      - 残工数: {{ steps.forecast.output.remaining_effort }}
      - 現在のベロシティ: {{ params.velocity_per_day }} / 日
      - 予測完了日: {{ steps.forecast.output.projected_completion }}
      - ドリフト: {{ steps.forecast.output.drift_days }} 日（正=遅延）
      - 見積もりが無いタスク: {{ steps.forecast.output.unestimated }}
      - 未アサインの課題: {{ steps.issues.output.unassigned }}
      - 判定: {{ steps.classify.output.reason }}

      タスク一覧:
      {{ steps.tasks.output }}

      必ず守ること:
      - 全体を書き直すのではなく、差分（何をどう変えるか）だけを考える。
        変更しないタスクには一切触れないこと。
      - 前提として置いたこと（assumptions）は必ず書くこと。データに無いことを
        断定しないこと。
      - ドリフトの重大度（tier）はあなたが判断するものではありません。
        propose を呼ぶときに tier は渡さないでください（受け付けられません）。
      - confidence は、あなた自身のこの再計画案そのものへの自信度です
        （0.0〜1.0）。迷ったら低めにすること。
      - 見積もりが無いタスクを動かす提案をする場合は、その旨を
        assumptions に明記すること。
      - 考えがまとまったら wbs_replan.propose を呼んで提案を記録してください。

  - id: notify_critical
    when: "{{ steps.classify.output.tier }} == 3"
    continue_on_error: true
    adapter: slack
    action: post_message
    inputs:
      channel: "{{ params.slack_channel }}"
      text: |
        :rotating_light: WBS 遅延が危機的水域です（Tier 3）

        ドリフト: {{ steps.forecast.output.drift_days }} 日
        予測完了日: {{ steps.forecast.output.projected_completion }}
        締切: {{ params.deadline }}

        Web UI で再計画案を確認してください。まだ何にも反映されていません。
