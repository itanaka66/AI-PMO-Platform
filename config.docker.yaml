# Docker 版 / Docker build
# ローカル LLM を既定にする。会議 Transcript は機微情報を含むため、
# 外部に出さない構成を既定とする。
# Local LLM by default. Meeting transcripts contain sensitive material,
# so the default posture keeps them inside the network.

tenant: company_a

llm:
  default:
    provider: ollama
    model: qwen2.5:14b
  fast:
    provider: ollama
    model: qwen2.5:7b

prompts_dir: prompts

adapters:
  mode: mock          # Step 2 で real に切替 / switch to real in Step 2
  slack:
    token: ${SLACK_BOT_TOKEN}
    default_channel: "#project-updates"
  postgres:
    # ./scripts/install-docker.sh が対話的に決め、.env に書く。自前でも
    # 外部でも、この行自体は書き換えない。
    # Decided interactively by ./scripts/install-docker.sh and written to
    # .env — self-hosted or external, this line does not change either way.
    dsn: ${AIPMO_PG_DSN}
    queries_file: queries.yaml
  qdrant:
    # 同じく .env から。「使わない」を選んだ場合は空文字になり、実際に
    # ナレッジ機能を呼んだときだけエラーになる（他の機能には影響しない）。
    # Also from .env. Choosing "don't use it" leaves this empty — it only
    # errors if a knowledge/vector-search feature is actually invoked,
    # nothing else is affected.
    url: ${QDRANT_URL}
    api_key: ${QDRANT_API_KEY}
    public_collection: public_pmo_knowledge
    embedding:
      provider: ollama
      model: bge-m3
      dimension: 1024
