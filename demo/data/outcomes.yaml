# デモ用の完了実績(学習の材料)。過去に終わった仕事の記録で、PMO Core が次を学ぶ:
#   - 「bug」ラベルは遅れやすい → 順位に加点
#   - 佐藤は遅れがち、鈴木は期限どおり → 担当の上限(キャパシティ)を補正
#   - 見積りと実日数 → 1 ポイントあたりの日数(ペース)
# 少なくとも 5 件ないと学習は始まらない(min_samples)。
#
#   done_days_ago: 何日前に終わったか   late_days: 期限に対する遅れの日数(負は前倒し)
#   effort: 見積り   duration_days: 着手から完了までの日数
#
# Past completions, the material the PMO Core learns from (at least 5 are needed).
