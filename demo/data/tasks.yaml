# デモ用のタスク。日付は「実行した日」からの相対で書く(いつ読み込んでも、期限切れ・間近の状況が再現される)。
#
#   due:          期限。今日から何日後か(負の数は期限切れ)
#   age:          台帳に最初に現れてから何日(省略時は 4)
#   started_days: 「着手」してから何日(In Progress のとき。省略時は age)
#   blocked_days: ブロックされてから何日(status が Blocked のとき)
#   assignee:     省略すると担当未定 → PMO Core が担当を「提案」する(ラベルとスキルが合う人から)
#   effort:       見積り(ポイント)
#
# Sample tasks. Dates are relative to the day you load them, so overdue / due-soon situations
# are reproduced whenever you run it.
#
# 仕込んだ状況 / what is staged:
#   - 佐藤が 5 件を抱えている(上限 3) ……… 過負荷 → 自律的な判断が「提案」を出す
#   - WEB-101 / MOB-201 / INF-330 が期限切れ ……… 警告 → 続くと対応タスクの「提案」になる
#   - INF-301 が 6 日ブロック ……… 長期ブロックの警告
#   - 担当未定が 4 件 ……… 担当の「提案」(確定は人)
#   - 開発AI に 3 件 ……… 役割AIの成果が、人のレビュー待ちになる
