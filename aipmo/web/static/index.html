<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1f5f8b">
<meta name="robots" content="noindex, nofollow">
<title>AI-PMO</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <span class="wordmark">AI-PMO</span>
  <span class="pulse" id="pulse" data-state="unknown" role="status"
        aria-label="connection"></span>
  <span class="tenant" id="tenant"></span>
</header>

<nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>

<main id="main">
  <section id="inbox-view" data-tab="inbox" hidden aria-labelledby="h-inbox">
    <h2 id="h-inbox" class="visually-hidden">Inbox</h2>
    <div id="inbox"></div>
  </section>

  <h2 id="h-pmo" data-tab="pmo" hidden>PMO Core</h2>
  <div id="pmo" data-tab="pmo"></div>

  <h2 id="h-proposals" data-tab="wbs">WBS Proposals</h2>
  <div id="proposals" data-tab="wbs"></div>

  <h2 id="h-templates" data-tab="templates">Templates</h2>
  <div id="templates" data-tab="templates"></div>

  <h2 id="h-runs" data-tab="runs">Runs</h2>
  <div id="runs" class="spine" data-tab="runs"></div>
</main>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="/static/app.js"></script>
</body>
</html>
