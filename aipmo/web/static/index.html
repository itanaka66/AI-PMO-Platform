<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1f5f8b">
<meta name="robots" content="noindex, nofollow">
<title>AI-PMO</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <span class="wordmark">AI-PMO</span>
  <span class="pulse" id="pulse" data-state="unknown" role="status"
        aria-label="connection"></span>
  <span class="tenant" id="tenant"></span>
</header>

<nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>

<main id="main">
  <section id="today-view" data-tab="today" hidden aria-labelledby="h-today">
    <h2 id="h-today" class="visually-hidden">Today</h2>
    <div id="today"></div>
  </section>

  <section id="tasks-view" data-tab="tasks" hidden aria-labelledby="h-tasks">
    <h2 id="h-tasks" class="visually-hidden">Tasks</h2>
    <div id="tasks"></div>
  </section>

  <section id="reviews-view" data-tab="reviews" hidden aria-labelledby="h-reviews">
    <h2 id="h-reviews" class="visually-hidden">Reviews</h2>
    <div id="reviews"></div>
  </section>

  <section id="judgment-view" data-tab="judgment" hidden aria-labelledby="h-judgment">
    <h2 id="h-judgment" class="visually-hidden">Judgment</h2>
    <div id="judgment"></div>
  </section>

  <section id="members-view" data-tab="members" hidden aria-labelledby="h-members">
    <h2 id="h-members" class="visually-hidden">Members</h2>
    <div id="members"></div>
  </section>

  <section id="integrations-view" data-tab="integrations" hidden aria-labelledby="h-integrations">
    <h2 id="h-integrations" class="visually-hidden">Integrations</h2>
    <div id="integrations"></div>
  </section>

  <section id="inbox-view" data-tab="inbox" hidden aria-labelledby="h-inbox">
    <h2 id="h-inbox" class="visually-hidden">Inbox</h2>
    <div id="inbox"></div>
  </section>

  <h2 id="h-pmo" data-tab="tools" hidden>PMO Core</h2>
  <div id="pmo" data-tab="tools"></div>

  <div id="wbs-screen" data-tab="wbs"></div>

  <h2 id="h-proposals" data-tab="wbs">WBS Proposals</h2>
  <div id="proposals" data-tab="wbs"></div>

  <h2 id="h-knowledge" data-tab="tools" hidden>Knowledge</h2>
  <label id="learning-trust-rag" class="learning-trust-rag" data-tab="tools" hidden>
    <input type="checkbox" id="learning-trust-rag-checkbox">
    <span id="learning-trust-rag-label"></span>
  </label>
  <div id="knowledge" data-tab="tools"></div>

  <h2 id="h-templates" data-tab="tools">Templates</h2>
  <div id="templates" data-tab="tools"></div>

  <h2 id="h-runs" data-tab="tools">Runs</h2>
  <div id="run-queue-status" class="run-queue-status" data-tab="tools" hidden></div>
  <div id="run-timeline" class="run-timeline" data-tab="tools" hidden>
    <div id="run-timeline-axis" class="run-timeline-axis"></div>
    <div id="run-timeline-rows" class="run-timeline-rows"></div>
    <ol id="run-timeline-upcoming" class="run-timeline-upcoming" hidden></ol>
  </div>
  <div id="runs" class="spine" data-tab="tools"></div>
</main>

<dialog id="run-progress" class="run-progress" aria-labelledby="run-progress-title">
  <p id="run-progress-title" class="run-progress-title"></p>
  <progress id="run-progress-meter" max="1"></progress>
  <p id="run-progress-step" class="run-progress-step"></p>
  <ol id="run-progress-queue" class="run-progress-queue" hidden></ol>
</dialog>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="/static/app.js"></script>
</body>
</html>
