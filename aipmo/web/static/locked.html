<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AI-PMO</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header><span class="wordmark">AI-PMO</span></header>
<main>
  <h2>アクセスキーが必要です / Access key required</h2>
  <div class="empty">
    <p>サーバーを起動したときに表示された URL を開いてください。<br>
       Open the URL shown when the server started.</p>
    <p style="font-family:var(--mono);font-size:12px">
      http://&lt;host&gt;:8765/?token=…
    </p>
    <p style="font-size:13px">
      URL を忘れた場合は、サーバー側で <code>aipmo serve</code> を実行し直すと再表示されます。<br>
      Lost it? Run <code>aipmo serve</code> again on the server to print it.
    </p>
  </div>
</main>
</body>
</html>
