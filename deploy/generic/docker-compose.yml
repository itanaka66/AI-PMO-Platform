# どのクラウド・VPS でも使える構成 / a deployment that works on any cloud or VPS.
#
# 既定（プロファイル無し）は caddy + aipmo + scheduler の3つだけ。
# 1GB RAM クラスの無料枠（GCP e2-micro・Azure B1S・AWS t2/t3.micro）を
# 想定した最小構成で、PostgreSQL は Aiven や RDS など外部の無料プランに置く
# 前提です。ベクトル検索 (Qdrant) は自前コンテナとしてはここには含めません
# — 1GB では同時に走らせる余地がほぼ無いためです。ただし .env に
# QDRANT_URL（+ QDRANT_API_KEY）を書けば、外部の Qdrant Cloud 無料プランは
# 1GB のままでも使えます — こちらはこの compose の RAM を消費しません。
#
# The default (no profile) starts only caddy + aipmo + scheduler — a minimal
# footprint sized for 1GB-class free tiers (GCP e2-micro, Azure B1S, AWS
# t2/t3.micro), assuming PostgreSQL lives externally (Aiven, RDS, etc.). A
# self-hosted Qdrant container is left out by default: there is little room
# left for it at 1GB. An external Qdrant Cloud free plan works fine even at
# 1GB, though — set QDRANT_URL (+ QDRANT_API_KEY) in .env; it costs this
# compose no RAM at all.
#
# 有料 VPS のように RAM に余裕がある場合は、プロファイルで足せます。
# Postgres と Ollama は互いに独立したプロファイルなので、
# 「Postgres は外部、LLM だけ自前」のような組み合わせも選べます。
#
# With more RAM (a paid VPS), add services back with profiles. Postgres and
# Ollama are independent profiles, so "external Postgres, self-hosted LLM
# only" (or the reverse) is a valid combination too.
#
#   docker compose --profile full up -d
#     # + Qdrant
#   docker compose --profile full --profile selfhosted up -d
#     # + Qdrant + 自前 Postgres / + Qdrant + your own Postgres
#   docker compose --profile full --profile selfhosted --profile ollama up -d
#     # + Qdrant + 自前 Postgres + 自前 Ollama（会議録を外に出さない構成）
#     # + Qdrant + your own Postgres + your own Ollama (transcripts never
#     #   leave the network)
#
# selfhosted を使う場合、.env の AIPMO_PG_DSN をこのコンテナ (postgres) へ
# 向けてください: postgresql://aipmo:aipmo@postgres:5432/aipmo
# With selfhosted, point .env's AIPMO_PG_DSN at this container instead:
#   postgresql://aipmo:aipmo@postgres:5432/aipmo
#
# ollama を使う場合、.env の OLLAMA_HOST をこのコンテナへ向け、
# config.yaml の llm プロファイルを ollama に切り替えてください
# （config.yaml.example にどちらの例も書いてあります）:
#   OLLAMA_HOST=http://ollama:11434
# With ollama, point .env's OLLAMA_HOST at this container and switch the
# llm profile in config.yaml to ollama (config.yaml.example shows both):
#   OLLAMA_HOST=http://ollama:11434
#
# full を自前 Qdrant として使う場合、.env の QDRANT_URL をこのコンテナへ
# 向けてください（API key は不要）:
#   QDRANT_URL=http://qdrant:6333
# 外部の Qdrant Cloud を使う場合は full を付けず、.env にその URL と
# API key だけを書いてください。
#
# Using full for a self-hosted Qdrant: point .env's QDRANT_URL at this
# container (no API key needed):
#   QDRANT_URL=http://qdrant:6333
# Using an external Qdrant Cloud instead: skip full and just set its URL
# and API key in .env.
#
# selfhosted・ollama・full のいずれも指定しなければ、対応するサービスも
# その名前付き volume も一切作られません — 外部サービスを使う場合、
# ローカルにデータは残りません。
#
# Leaving a profile out (selfhosted, ollama, or full) means its service —
# and its named volume — is never created at all: pointing at an external
# service leaves no local data behind.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    depends_on:
      - aipmo
    restart: unless-stopped
    # TLS はここで終端する。アプリ側は TLS を持たない。
    # TLS terminates here; the application does not implement it.
    deploy:
      resources:
        limits: { memory: 128M }

  aipmo:
    build:
      context: ../..
      dockerfile: deploy/generic/Dockerfile
    env_file: .env
    environment:
      AIPMO_CONFIG: /app/config.yaml
      AIPMO_WEB_TOKEN: ${AIPMO_WEB_TOKEN:?set AIPMO_WEB_TOKEN in .env}
      AIPMO_VIEWER_TOKEN: ${AIPMO_VIEWER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AIPMO_PG_DSN: ${AIPMO_PG_DSN:?set AIPMO_PG_DSN in .env}
      # 未設定なら config.yaml はクラウド LLM を使う想定。--profile ollama
      # で自前 Ollama を足す場合だけ、.env で下のコンテナ名に向ける。
      # Left unset, config.yaml is expected to use a cloud LLM. Only point
      # this at the container name below when adding --profile ollama.
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      # 両方未設定ならナレッジ機能は使わない想定。外部 Qdrant Cloud か、
      # --profile full のこのコンテナ名のどちらかを .env で指定する。
      # With both unset, the knowledge features are expected to be unused.
      # Set either an external Qdrant Cloud URL or this container's name
      # (with --profile full) in .env.
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - ../../templates:/app/templates:ro
      - ../../prompts:/app/prompts:ro
      - ./config.yaml:/app/config.yaml:ro
      # Aiven / RDS など、証明書検証つきの外部 DB を使うときだけ要る。
      # 使わない場合はこの行を削除して構わない。
      # Only needed for an externally verified DB (Aiven, RDS). Remove this
      # line if you are not using one.
      - ./db-ca.pem:/app/db-ca.pem:ro
    restart: unless-stopped
    # 公開はしない。Caddy 経由でのみ届く。
    # Not published: reachable only through Caddy.
    expose:
      - "8765"
    command: ["serve", "--host", "0.0.0.0", "--port", "8765"]
    deploy:
      resources:
        limits: { memory: 512M }

  # 定時実行。画面とは別のコンテナにする。
  # 画面の再起動で予定が止まるのは困るし、逆に定時処理が重いときに
  # 画面が応答しなくなるのも困る。
  #
  # The scheduler runs as its own container: a restart of the interface should
  # not stop the schedule, and a heavy scheduled run should not make the
  # interface unresponsive.
  scheduler:
    build:
      context: ../..
      dockerfile: deploy/generic/Dockerfile
    env_file: .env
    environment:
      AIPMO_CONFIG: /app/config.yaml
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AIPMO_PG_DSN: ${AIPMO_PG_DSN:?set AIPMO_PG_DSN in .env}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - ../../templates:/app/templates:ro
      - ../../prompts:/app/prompts:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./db-ca.pem:/app/db-ca.pem:ro
    restart: unless-stopped
    command: ["schedule"]
    # 実行中のテンプレートを最後まで走らせてから止まる。途中で切ると、
    # 課題は起票されたのに通知されていない、といった半端が残る。
    # Lets the current run finish: cutting it short leaves half-states, such
    # as issues filed but nobody told.
    stop_grace_period: 120s
    deploy:
      resources:
        limits: { memory: 512M }

  # 自前のベクトル検索。1GB クラスの無料枠には基本的に乗らないので既定
  # では外す。--profile full で足す。外部の Qdrant Cloud を使うなら
  # このコンテナ自体が要らない — .env にその URL を書くだけでよい。
  # Your own vector search. Left out by default since it rarely fits a
  # 1GB-class free tier; add it with --profile full. Using an external
  # Qdrant Cloud instead needs no container at all — just its URL in .env.
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["full"]
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 1G }

  # 自前の PostgreSQL。RAM に余裕がある有料 VPS 向け。無料枠の小さな
  # 機械では Aiven や RDS など外部の無料プランを使う方が現実的。
  # Your own PostgreSQL, for a paid VPS with RAM to spare. On a small free-tier
  # machine, an external free plan (Aiven, RDS) is the more realistic choice.
  postgres:
    image: postgres:16-alpine
    profiles: ["selfhosted"]
    environment:
      POSTGRES_USER: aipmo
      POSTGRES_PASSWORD: aipmo
      POSTGRES_DB: aipmo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipmo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512M }

  # 自前の Ollama。RAM に余裕があり、会議録などを外部 LLM に出したくない
  # 場合向け。GPU が無いと推論は遅い — CPU だけで動く小さいモデルを選ぶこと。
  # Your own Ollama, for a machine with RAM to spare that should not send
  # transcripts to an external LLM. Inference is slow without a GPU — pick a
  # small model that runs acceptably on CPU alone.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/11434'"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 2G }
    # GPU がある場合はコメントを外す / uncomment if a GPU is available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  scheduler_state:
  caddy_data:
  caddy_config:
  qdrant_data:
  postgres_data:
  ollama_models:
