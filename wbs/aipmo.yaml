# AI-PMO Platform 自身の開発の WBS。運用は docs/SELF-WBS.md。
#
# - 変更は PR で行う（git の履歴が変更の記録になる）。
# - status: done は、evidence のファイル（と `::` の後の語句）が実在するときだけ
#   通る。CI（aipmo wbs check）が確かめる。証拠の無い完了は書けない。
# - effort は相対的な大きさの目安（1 = 半日程度）。done の値は事後の見積りで、
#   実績を測ったものではない。速度（完了見込み）はこの値と done_on から出す
#   ので、あくまで目安。
# - done_on は、最後の証拠が揃った日（git log から機械的に取った。コミット前は作成日）。
#
# aipmo wbs check    … 誤りと証拠の欠けを調べる
# aipmo wbs status   … 進捗・速度・完了見込み・クリティカルパス
