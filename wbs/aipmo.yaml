# AI-PMO Platform 自身の開発の WBS。運用は docs/SELF-WBS.md。
#
# - 変更は PR で行う（git の履歴が変更の記録になる）。
# - status: done は、evidence のファイル（と `::` の後の語句）が実在するときだけ
#   通る。CI（aipmo wbs check）が確かめる。証拠の無い完了は書けない。
# - effort は相対的な大きさの目安（1 = 半日程度）。done の値は事後の見積りで、
#   実績を測ったものではない。速度（完了見込み）はこの値と done_on から出す
#   ので、あくまで目安。
# - done_on は、最後の証拠が揃った日（git log から機械的に取った。コミット前は作成日）。
#
# aipmo wbs check    … 誤りと証拠の欠けを調べる
# aipmo wbs status   … 進捗・速度・完了見込み・クリティカルパス
wbs:
  id: aipmo
  name: AI-PMO Platform の開発
  deadline: null              # 全体の期限。決まっていないので未設定（遅延は予測しない）
  velocity_window_days: 28    # 速度は直近これだけの日数の完了実績から出す
  nodes:
    - id: "1"
      name: "実行基盤"
      children:
        - id: "1.1"
          name: "テンプレート DSL とステップ実行（adapter / llm / transform / for_each）"
          status: done
          effort: 5
          done_on: 2026-08-29
          evidence:
            - "aipmo/dsl/loader.py"
            - "aipmo/engine/runner.py"
            - "tests/test_engine.py"
        - id: "1.2"
          name: "エージェント（道具の許可・承認・往復と費用の上限）"
          status: done
          effort: 5
          done_on: 2026-08-29
          evidence:
            - "aipmo/engine/agent.py"
            - "tests/test_agent.py"
            - "docs/AGENTS.md"
        - id: "1.3"
          name: "定時実行と常駐（cron・重複防止・停止中の扱い）"
          status: done
          effort: 3
          done_on: 2026-08-29
          evidence:
            - "aipmo/engine/scheduler.py"
            - "aipmo/engine/cron.py"
            - "tests/test_scheduler.py"
        - id: "1.4"
          name: "並列ステップ"
          status: done
          effort: 3
          done_on: 2026-09-03
          evidence:
            - "aipmo/engine/parallel.py"
            - "tests/test_parallel_runner.py"
        - id: "1.5"
          name: "人の承認（Slack 承認）"
          status: done
